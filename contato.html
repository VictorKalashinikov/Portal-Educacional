<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Educacional - Contato</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-page="contato">
  <!-- Top Navigation Bar -->
  <header class="top-nav">
    <div class="top-left">
      <span id="page-title">Portal Educacional - Contato</span>
    </div>
    <div class="top-center">
      <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Buscar...">
      </div>
    </div>
    <div class="top-right">
      <div class="user-profile">
        <i class="fas fa-user-circle user-avatar"></i>
        <span class="user-name">Helena</span>
        <i class="fas fa-chevron-down"></i>
      </div>
    </div>
  </header>

  <!-- Sub Navigation Bar -->
  <nav class="sub-nav">
    <div class="nav-links">
      <a href="index.html" class="nav-btn" data-page="home"><i class="fas fa-home"></i> Home</a>
      <a href="faltas.html" class="nav-btn" data-page="faltas"><i class="fas fa-user-graduate"></i> Faltas</a>
      <a href="horarios.html" class="nav-btn" data-page="horarios"><i class="fas fa-calendar-alt"></i> Horários</a>
      <a href="notas.html" class="nav-btn" data-page="notas"><i class="fas fa-graduation-cap"></i> Notas</a>
      <a href="contato.html" class="sub-link active" data-page="contato">Contato</a>
      <a href="#" class="sub-link">Links</a>
    </div>
    <div class="senai-logo">
      <span class="fiep-text">Sistema Fiep</span>
      <span class="senai-text">SENAI</span>
    </div>
  </nav>

  <!-- Main Content Container -->
  <main class="main-container">
    <div class="page-content">
      <div class="contact-card">
        <h2>Fale Conosco - Secretaria Escolar</h2>
        <p>Envie sua mensagem ou dúvida diretamente para a coordenação ou suporte do Sistema SENAI.</p>
        
        <form class="contact-form" id="contact-form">
          <div class="form-group">
            <label for="assunto">Assunto</label>
            <select id="assunto" required>
              <option value="">Selecione o assunto...</option>
              <option value="secretaria">Secretaria / Documentação</option>
              <option value="financeiro">Financeiro / Boletos</option>
              <option value="pedagogico">Coordenação Pedagógica</option>
              <option value="suporte">Suporte Técnico Portal</option>
            </select>
          </div>

          <div class="form-group">
            <label for="mensagem">Mensagem</label>
            <textarea id="mensagem" rows="5" placeholder="Digite sua mensagem aqui..." required></textarea>
          </div>

          <button type="submit" class="submit-btn">Enviar Mensagem</button>
        </form>
        <div id="form-feedback" class="feedback-msg"></div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
